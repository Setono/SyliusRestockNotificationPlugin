setono_sylius_restock_notification:
    email:
        restock_notification:
            anchor_text: Clicez ici pour voir le produit
            intro: |
                <p>Bonjour</p>
                <p>Vous avez demandé à être notifié du retour en stock du produit %product%.</p>
                <p>Et bien, nous avons du nouveau pour vous ! Le produit est de nouveau disponible.</p>
            regards: <p>Bonne journée, et bon shopping ;)</p>
            subject: Votre produit tant attendu est de retour en stock !
    form:
        notification:
            channel: Canal
            email: Email
            help:
                header: Aide
                content: |
                    <p>Lorsque vous créez une notification pour un retour en stock, le canal et la langue sont utilisés pour déterminer
                    le contenu de l'email envoyé au client. Soyez donc sur de sélectionner ce que le client s'attend à voir.</p>
            locale: Langue
            product_variant: Variante
    menu:
        admin:
            main:
                marketing:
                    notifications: Notification de restockage
    ui:
        available_notifications:
            header: Notifications de restockage disponibles
            explanation: |
                <p>Certaines variants de ce produit ne sont pas en stock. Vous pouvez vous inscrire pour recevoir un email dès que le produit est de retour en stock.</p>
