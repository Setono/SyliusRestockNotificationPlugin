setono_sylius_restock_notification:
    email:
        restock_notification_request:
            anchor_text: Click here to see the product
            intro: |
                <p>Hi there</p>
                <p>You signed up to receive an email when the product, %product%, was back in stock.</p>
                <p>Well, I've got news for you! The product has just been restocked.</p>
            regards: <p>Have a great day and enjoy your shopping ;)</p>
            subject: Your long awaited product has just been restocked!
    form:
        restock_notification_request:
            help:
                header: Help
                content: |
                    <p>When you create a restock notification request, the channel and locale is used to determine the content
                    of the email being sent to customer, so make sure to select what the customer expects.</p>
            channel_placeholder: Select channel...
    menu:
        admin:
            main:
                marketing:
                    restock_notification_requests: Restock notification requests
    ui:
        dialog:
            header: Out of stock
            body: Receive an email when this product is back in stock
        days_waited: Days waited
        edit_restock_notification_request: Edit restock notification request
        error_message: Something went wrong. Please try again.
        manage_restock_notification_requests: Manage restock notification requests
        new_restock_notification_request: New restock notification request
        restock_notification_requests: Restock notification requests
        notify_me: Notify me
        remind_me: Remind me
        sent_at: Sent at
        success_message: You will receive an email when the product is back in stock
        states:
            failed: Failed
            pending: Pending
            processing: Processing
            sent: Sent
