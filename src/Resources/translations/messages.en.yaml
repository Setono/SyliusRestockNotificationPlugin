setono_sylius_restock_notification:
    email:
        restock_notification:
            anchor_text: Click here to see the product
            intro: |
                <p>Hi there</p>
                <p>You signed up to receive an email when the product, %product%, was back in stock.</p>
                <p>Well, I've got news for you! The product has just been restocked.</p>
            regards: <p>Have a great day and enjoy your shopping ;)</p>
            subject: Your long awaited product has just been restocked!
    form:
        notification:
            channel: Channel
            email: Email
            help:
                header: Help
                content: |
                    <p>When you create a restock notification, the channel and locale is used to determine the content
                    of the email being sent to customer, so make sure to select what the customer expects.</p>
            locale: Locale
            product_variant: Variant
    menu:
        admin:
            main:
                marketing:
                    notifications: Restock notifications
    ui:
        available_notifications:
            header: Available restock notifications
            explanation: |
                <p>Some of the variants on this product is not in stock. Here you can sign up to receive an email once the respective variant is in stock.</p>
        created_at: Created at
        days_waited: Days waited
        edit_notification: Edit restock notification
        email: Email
        manage_notifications: Manage restock notifications
        new_notification: New restock notification
        notifications: Restock notifications
        notify_me: Notify me
        sent_at: Sent at
        state: State
        states:
            error: Error
            pending: Pending
            processing: Processing
            sent: Sent
