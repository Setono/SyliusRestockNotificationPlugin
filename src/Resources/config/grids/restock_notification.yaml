sylius_grid:
    grids:
        setono_sylius_restock_notification_admin_notification:
            driver:
                name: doctrine/orm
                options:
                    class: "%setono_sylius_restock_notification.model.notification.class%"
            sorting:
                createdAt: desc
            fields:
                email:
                    type: string
                    label: setono_sylius_restock_notification.ui.email
                product_variant:
                    type: twig
                    label: sylius.ui.product
                    options:
                        template: "@SetonoSyliusRestockNotificationPlugin/admin/grid/field/product_variant.html.twig"
                state:
                    type: string
                    label: setono_sylius_restock_notification.ui.state
                createdAt:
                    type: datetime
                    label: setono_sylius_restock_notification.ui.created_at
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [email]
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
